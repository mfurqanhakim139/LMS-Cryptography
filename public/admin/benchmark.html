<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Research Benchmark Tool | AES-256-GCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-300 min-h-screen flex items-center justify-center p-6">
    
    <div class="max-w-3xl w-full bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="p-8 border-b border-slate-700 bg-slate-800/50">
            <div class="flex items-center justify-between mb-2">
                <h1 class="text-2xl font-bold text-white flex items-center gap-3">
                    <i class="ph-duotone ph-flask text-indigo-500 text-3xl"></i>
                    Alat Ekstraksi Data Riset Q1
                </h1>
                <span class="bg-indigo-500/20 text-indigo-400 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wider">Mode Peneliti</span>
            </div>
            <p class="text-slate-400 text-sm">Alat ini akan melakukan stress-test pengiriman dan dekripsi data AES-256-GCM untuk mengukur latensi end-to-end.</p>
        </div>

        <div class="p-8 space-y-6">
            <div class="grid grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Jumlah Iterasi (Pengujian)</label>
                    <input type="number" id="iterations" value="100" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Target Endpoint API</label>
                    <select id="endpoint" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500">
                        <option value="course&action=get_all_courses">Get All Courses (Payload Ringan)</option>
                        <option value="course&action=get_modules&course_id=1">Get Modules (Payload Sedang)</option>
                    </select>
                </div>
            </div>

            <div class="bg-slate-900 rounded-xl p-5 border border-slate-700">
                <div class="flex justify-between text-sm font-semibold mb-2">
                    <span class="text-slate-400">Progres Pengujian:</span>
                    <span id="progress-text" class="text-indigo-400">0 / 100</span>
                </div>
                <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
                    <div id="progress-bar" class="bg-indigo-500 h-3 rounded-full transition-all duration-75" style="width: 0%"></div>
                </div>
            </div>

            <!-- Log Terminal -->
            <div class="bg-black rounded-xl p-4 h-48 overflow-y-auto font-mono text-xs text-green-400 border border-slate-700 shadow-inner" id="terminalLog">
                > Sistem siap. Tekan 'Mulai Ekstraksi Data' untuk menjalankan simulasi...<br>
            </div>

            <div class="flex gap-4 pt-4 border-t border-slate-700">
                <button id="startBtn" onclick="runBenchmark()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-lg shadow-indigo-500/20">
                    <i class="ph-bold ph-play"></i> Mulai Ekstraksi Data
                </button>
                <button id="downloadBtn" onclick="downloadCSV()" disabled class="flex-1 bg-slate-700 text-slate-500 font-bold py-4 rounded-xl cursor-not-allowed flex items-center justify-center gap-2 transition-all">
                    <i class="ph-bold ph-download-simple"></i> Unduh Dataset (CSV)
                </button>
            </div>
        </div>
    </div>

    <!-- Kriptografi AES-256-GCM -->
    <script src="../js/crypto_client.js?v=5"></script>
    <script>
        let benchmarkData = [];

        function log(message, type="info") {
            const terminal = document.getElementById('terminalLog');
            const color = type === "error" ? "text-red-500" : (type === "success" ? "text-yellow-400" : "text-green-400");
            terminal.innerHTML += `<span class="${color}">> ${message}</span><br>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function runBenchmark() {
            const iterations = parseInt(document.getElementById('iterations').value);
            const endpointSuffix = document.getElementById('endpoint').value;
            const startBtn = document.getElementById('startBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            
            benchmarkData = [];
            startBtn.disabled = true;
            startBtn.classList.replace('bg-indigo-600', 'bg-slate-600');
            startBtn.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin"></i> Sedang Berjalan...';
            
            downloadBtn.disabled = true;
            downloadBtn.classList.replace('bg-emerald-600', 'bg-slate-700');
            downloadBtn.classList.replace('text-white', 'text-slate-500');
            downloadBtn.classList.add('cursor-not-allowed');

            log(`Memulai ${iterations} iterasi ke endpoint ${endpointSuffix.split('&')[1]}...`, "success");

            for (let i = 1; i <= iterations; i++) {
                try {
                    // 1. Catat Waktu Mulai Fetch
                    const startFetch = performance.now();
                    
                    const response = await fetch(`https://kursus.mitrautamateknologi.xyz/public/api.php?ctrl=${endpointSuffix}&nocache=${Math.random()}`);
                    const result = await response.json();
                    
                    const endFetch = performance.now();
                    const fetchLatency = endFetch - startFetch;

                    if (result.status === 'success') {
                        // 2. Catat Waktu Dekripsi
                        const startDecrypt = performance.now();
                        const decrypted = await decryptPayload(result.data.payload, result.data.iv, result.data.tag);
                        const endDecrypt = performance.now();
                        
                        const decryptLatency = endDecrypt - startDecrypt;
                        const totalLatency = fetchLatency + decryptLatency;

                        // 3. Simpan ke Array
                        benchmarkData.push({
                            iteration: i,
                            payload_size_bytes: JSON.stringify(result.data).length,
                            network_fetch_ms: fetchLatency.toFixed(2),
                            decryption_ms: decryptLatency.toFixed(2),
                            total_latency_ms: totalLatency.toFixed(2)
                        });

                        if (i % 10 === 0 || i === iterations) {
                            log(`Iterasi ${i}/${iterations} | Fetch: ${fetchLatency.toFixed(2)}ms | Decrypt: ${decryptLatency.toFixed(2)}ms`);
                        }
                    } else {
                        log(`Iterasi ${i} Gagal: Server mengembalikan error.`, "error");
                    }
                } catch (error) {
                    log(`Iterasi ${i} Gagal: Koneksi terputus.`, "error");
                }

                // Update UI Progress
                const percent = (i / iterations) * 100;
                progressBar.style.width = `${percent}%`;
                progressText.innerText = `${i} / ${iterations}`;
            }

            log(`Ekstraksi data selesai! Berhasil merekam ${benchmarkData.length} baris data.`, "success");
            
            // Aktifkan Tombol Download
            startBtn.disabled = false;
            startBtn.classList.replace('bg-slate-600', 'bg-indigo-600');
            startBtn.innerHTML = '<i class="ph-bold ph-play"></i> Uji Ulang';
            
            downloadBtn.disabled = false;
            downloadBtn.classList.replace('bg-slate-700', 'bg-emerald-600');
            downloadBtn.classList.replace('text-slate-500', 'text-white');
            downloadBtn.classList.remove('cursor-not-allowed');
        }

        function downloadCSV() {
            if (benchmarkData.length === 0) return;

            let csvContent = "data:text/csv;charset=utf-8,";
            
            // Header CSV
            csvContent += "Iteration,Payload_Size_Bytes,Network_Fetch_Latency_ms,AES256GCM_Decryption_ms,Total_Latency_ms\n";
            
            // Isi Data
            benchmarkData.forEach(row => {
                csvContent += `${row.iteration},${row.payload_size_bytes},${row.network_fetch_ms},${row.decryption_ms},${row.total_latency_ms}\n`;
            });

            // Trigger Download File
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `dataset_aes256gcm_q1_${benchmarkData.length}_samples.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            log("File CSV berhasil diunduh!", "success");
        }
    </script>
</body>
</html>
