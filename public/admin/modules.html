<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Modul | Admin EduPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden">

    <!-- Sidebar Admin -->
    <aside class="w-64 bg-white border-r border-slate-200 hidden md:flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-100">
            <h1 class="text-xl font-extrabold text-indigo-600 tracking-tight">EduPortal<span class="text-slate-800">Admin</span></h1>
        </div>
        <nav class="flex-1 p-4 space-y-1">
            <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50 font-medium transition-colors">
                <i class="ph ph-squares-four text-xl"></i> Dasbor
            </a>
            <a href="modules.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-indigo-50 text-indigo-600 font-medium transition-colors">
                <i class="ph-fill ph-video-camera text-xl"></i> Kelola Modul Video
            </a>
        </nav>
    </aside>

    <!-- Area Konten Utama -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto relative">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 sticky top-0 z-20">
            <h2 class="text-lg font-bold text-slate-800">Upload Modul Baru</h2>
        </header>

        <div class="p-6 md:p-8 max-w-3xl">
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 md:p-8">
                
                <form id="uploadForm" class="space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <!-- Judul Modul -->
                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Judul Modul</label>
                            <input type="text" id="title" name="title" required class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="Contoh: Pengenalan Arsitektur MVC">
                        </div>

                        <!-- Urutan Modul -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Urutan Modul (Sequence)</label>
                            <input type="number" id="sequence" name="sequence" required min="1" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="1">
                        </div>

                        <!-- Durasi -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Durasi Video (dalam detik)</label>
                            <input type="number" id="duration" name="duration" required min="1" class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition" placeholder="Contoh: 300 (untuk 5 menit)">
                        </div>
                    </div>

                    <!-- Upload File Area -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">File Video (MP4)</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center hover:bg-slate-50 transition cursor-pointer relative" id="dropZone">
                            <input type="file" id="videoFile" name="video" accept="video/mp4" required class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10">
                            <i class="ph-fill ph-cloud-arrow-up text-5xl text-indigo-400 mb-3"></i>
                            <h3 class="text-sm font-bold text-slate-700">Klik atau tarik file video ke sini</h3>
                            <p class="text-xs text-slate-500 mt-1" id="fileNameDisplay">Maksimal ukuran file menyesuaikan pengaturan server lokal Anda.</p>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-4 rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                        <i class="ph-bold ph-upload-simple"></i> Upload dan Simpan
                    </button>
                </form>

            </div>
        </div>
    </main>

    <script>
        // Logika untuk menampilkan nama file yang dipilih
        document.getElementById('videoFile').addEventListener('change', function(e) {
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            if (e.target.files.length > 0) {
                fileNameDisplay.innerHTML = `<span class="text-emerald-600 font-bold">File terpilih: ${e.target.files[0].name}</span>`;
            }
        });

        // Logika Eksekusi Upload API
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah reload halaman

            const form = document.getElementById('uploadForm');
            const submitBtn = document.getElementById('submitBtn');
            const originalBtnHtml = submitBtn.innerHTML;

            // Siapkan FormData (Bawaan browser untuk mengirim file binary)
            const formData = new FormData(form);

            // Ubah tombol jadi status loading
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin text-xl"></i> Sedang Mengunggah... (Jangan tutup halaman ini)';
            submitBtn.classList.replace('bg-indigo-600', 'bg-slate-400');

            try {
                // Tembak ke API PHP kita
                const response = await fetch('../api.php?ctrl=admin&action=upload_module', {
                    method: 'POST',
                    body: formData // Mengirim FormData tidak butuh header Content-Type, browser akan set otomatis ke multipart/form-data
                });

                const result = await response.json();

                if (result.status === 'success') {
                    Swal.fire('Berhasil!', result.message, 'success').then(() => {
                        form.reset(); // Kosongkan form
                        document.getElementById('fileNameDisplay').innerText = "Maksimal ukuran file menyesuaikan pengaturan server lokal Anda.";
                    });
                } else {
                    Swal.fire('Gagal Upload', result.message, 'error');
                }
            } catch (error) {
                console.error("Upload error:", error);
                Swal.fire('Error Koneksi', 'Gagal menghubungi server. Pastikan server lokal Anda menyala.', 'error');
            } finally {
                // Kembalikan tombol ke semula
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.classList.replace('bg-slate-400', 'bg-indigo-600');
            }
        });
    </script>
</body>
</html>
