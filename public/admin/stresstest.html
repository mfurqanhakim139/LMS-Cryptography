<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Stress Test Tool | AES-256-GCM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-300 min-h-screen flex items-center justify-center p-6">
    
    <div class="max-w-4xl w-full bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="p-8 border-b border-slate-700 bg-slate-800/50 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-white flex items-center gap-3 mb-2">
                    <i class="ph-duotone ph-lightning text-amber-500 text-3xl animate-pulse"></i>
                    Concurrent Stress Test (Q1)
                </h1>
                <p class="text-slate-400 text-sm">Mensimulasikan puluhan/ratusan mahasiswa mengakses dan mendekripsi data secara bersamaan.</p>
            </div>
            <span class="bg-red-500/20 text-red-400 px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider border border-red-500/30">Extreme Load</span>
        </div>

        <div class="p-8 space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Target Endpoint</label>
                    <select id="endpoint" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
                        <option value="course&action=get_modules&course_id=1">Get Modules (Payload Sedang)</option>
                        <option value="course&action=get_all_courses">Get All Courses (Payload Ringan)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Jumlah Request Paralel</label>
                    <input type="number" id="iterations" value="100" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-2">Mode Eksekusi</label>
                    <select id="execMode" class="w-full bg-slate-900 border border-slate-700 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-indigo-500">
                        <option value="concurrent">Concurrent (Bersamaan / Paralel)</option>
                        <option value="sequential">Sequential (Antre Satu per Satu)</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                    <p class="text-slate-400 text-xs font-bold uppercase mb-1">Sukses</p>
                    <p class="text-2xl font-black text-emerald-400" id="countSuccess">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                    <p class="text-slate-400 text-xs font-bold uppercase mb-1">Gagal (Error/Timeout)</p>
                    <p class="text-2xl font-black text-red-400" id="countError">0</p>
                </div>
                <div class="bg-slate-900 border border-slate-700 p-4 rounded-xl">
                    <p class="text-slate-400 text-xs font-bold uppercase mb-1">Waktu Total Uji</p>
                    <p class="text-2xl font-black text-indigo-400" id="totalTime">0 ms</p>
                </div>
            </div>

            <!-- Log Terminal -->
            <div class="bg-black rounded-xl p-4 h-40 overflow-y-auto font-mono text-xs text-green-400 border border-slate-700 shadow-inner" id="terminalLog">
                > Mesin Stress Test Siap. Peringatan: Mode Concurrent dapat membebani CPU Server Anda.<br>
            </div>

            <div class="flex gap-4 pt-4 border-t border-slate-700">
                <button id="startBtn" onclick="runBenchmark()" class="flex-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-4 px-6 rounded-xl transition-colors flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20">
                    <i class="ph-bold ph-rocket-launch"></i> Luncurkan Serangan API
                </button>
                <button id="downloadBtn" onclick="downloadCSV()" disabled class="flex-1 bg-slate-700 text-slate-500 font-bold py-4 rounded-xl cursor-not-allowed flex items-center justify-center gap-2 transition-all">
                    <i class="ph-bold ph-download-simple"></i> Ekspor CSV
                </button>
            </div>
        </div>
    </div>

    <!-- Kriptografi AES-256-GCM -->
    <script src="../js/crypto_client.js?v=5"></script>
    <script>
        let benchmarkData = [];
        let successCount = 0;
        let errorCount = 0;

        function log(message, type="info") {
            const terminal = document.getElementById('terminalLog');
            const color = type === "error" ? "text-red-500" : (type === "warning" ? "text-amber-400" : "text-green-400");
            terminal.innerHTML += `<span class="${color}">> ${message}</span><br>`;
            terminal.scrollTop = terminal.scrollHeight;
        }

        async function processSingleRequest(iteration, endpointSuffix) {
            const startFetch = performance.now();
            try {
                const response = await fetch(`https://kursus.mitrautamateknologi.xyz/public/api.php?ctrl=${endpointSuffix}&nocache=${Math.random()}`);
                const result = await response.json();
                const endFetch = performance.now();
                const fetchLatency = endFetch - startFetch;

                if (result.status === 'success') {
                    const startDecrypt = performance.now();
                    const decrypted = await decryptPayload(result.data.payload, result.data.iv, result.data.tag);
                    const endDecrypt = performance.now();
                    
                    const decryptLatency = endDecrypt - startDecrypt;
                    const totalLatency = fetchLatency + decryptLatency;

                    successCount++;
                    document.getElementById('countSuccess').innerText = successCount;

                    return {
                        iteration: iteration,
                        status: 'Success',
                        payload_size_bytes: JSON.stringify(result.data).length,
                        network_fetch_ms: fetchLatency.toFixed(2),
                        decryption_ms: decryptLatency.toFixed(2),
                        total_latency_ms: totalLatency.toFixed(2)
                    };
                } else {
                    throw new Error("Server Response Error");
                }
            } catch (error) {
                const endFetch = performance.now();
                errorCount++;
                document.getElementById('countError').innerText = errorCount;
                log(`[Iterasi ${iteration}] Gagal/Timeout: ${error.message}`, "error");
                return {
                    iteration: iteration,
                    status: 'Failed',
                    payload_size_bytes: 0,
                    network_fetch_ms: (endFetch - startFetch).toFixed(2),
                    decryption_ms: 0,
                    total_latency_ms: (endFetch - startFetch).toFixed(2)
                };
            }
        }

        async function runBenchmark() {
            const iterations = parseInt(document.getElementById('iterations').value);
            const endpointSuffix = document.getElementById('endpoint').value;
            const execMode = document.getElementById('execMode').value;
            
            const startBtn = document.getElementById('startBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            
            benchmarkData = [];
            successCount = 0;
            errorCount = 0;
            
            document.getElementById('countSuccess').innerText = "0";
            document.getElementById('countError').innerText = "0";
            document.getElementById('totalTime').innerText = "Menghitung...";

            startBtn.disabled = true;
            startBtn.classList.replace('bg-amber-600', 'bg-slate-600');
            startBtn.innerHTML = '<i class="ph-bold ph-spinner-gap animate-spin"></i> Menyerang Server...';
            
            downloadBtn.disabled = true;
            downloadBtn.classList.replace('bg-emerald-600', 'bg-slate-700');
            downloadBtn.classList.add('cursor-not-allowed', 'text-slate-500');
            downloadBtn.classList.remove('text-white');

            log(`Memulai ${iterations} request dengan mode ${execMode.toUpperCase()}...`, "warning");

            const globalStartTime = performance.now();

            if (execMode === 'concurrent') {
                // Tembak secara bersamaan menggunakan Promise.all
                const promises = [];
                for (let i = 1; i <= iterations; i++) {
                    promises.push(processSingleRequest(i, endpointSuffix));
                }
                benchmarkData = await Promise.all(promises);
            } else {
                // Antre satu persatu (Sequential)
                for (let i = 1; i <= iterations; i++) {
                    const data = await processSingleRequest(i, endpointSuffix);
                    benchmarkData.push(data);
                    if (i % 10 === 0) log(`Selesai antrean ke-${i}`);
                }
            }

            const globalEndTime = performance.now();
            const timeElapsed = (globalEndTime - globalStartTime).toFixed(2);
            document.getElementById('totalTime').innerText = `${timeElapsed} ms`;

            log(`Ekstraksi selesai! Waktu eksekusi total: ${timeElapsed} ms.`, "success");
            
            startBtn.disabled = false;
            startBtn.classList.replace('bg-slate-600', 'bg-amber-600');
            startBtn.innerHTML = '<i class="ph-bold ph-rocket-launch"></i> Luncurkan Ulang';
            
            downloadBtn.disabled = false;
            downloadBtn.classList.replace('bg-slate-700', 'bg-emerald-600');
            downloadBtn.classList.add('text-white');
            downloadBtn.classList.remove('cursor-not-allowed', 'text-slate-500');
        }

        function downloadCSV() {
            if (benchmarkData.length === 0) return;
            const execMode = document.getElementById('execMode').value;

            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Iteration,Status,Payload_Size_Bytes,Network_Fetch_Latency_ms,AES256GCM_Decryption_ms,Total_Latency_ms\n";
            
            benchmarkData.forEach(row => {
                csvContent += `${row.iteration},${row.status},${row.payload_size_bytes},${row.network_fetch_ms},${row.decryption_ms},${row.total_latency_ms}\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `dataset_stress_${execMode}_100_samples.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            log("File CSV hasil Stress Test berhasil diunduh!", "success");
        }
    </script>
</body>
</html>
