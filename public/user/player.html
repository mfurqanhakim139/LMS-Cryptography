<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Belajar | EduPortal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-300 flex h-screen overflow-hidden flex-col md:flex-row">

    <main class="flex-1 flex flex-col h-[60vh] md:h-screen relative">
        <!-- HEADER / NAVBAR PLAYER -->
        <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center px-4 md:px-6 z-10 shrink-0">
            <a href="dashboard.html" class="flex items-center gap-2 text-slate-400 hover:text-white transition group">
                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center group-hover:bg-indigo-600 transition-colors">
                    <i class="ph-bold ph-arrow-left"></i>
                </div>
                <span class="text-sm font-bold hidden sm:block">Kembali</span>
            </a>
            <div class="mx-auto flex items-center gap-3">
                <i class="ph-fill ph-monitor-play text-indigo-500 text-xl"></i>
                <h1 class="text-white font-bold text-sm md:text-base truncate max-w-[200px] md:max-w-md" id="courseTitleHeader">Memuat Data...</h1>
            </div>
            <button class="md:hidden text-white ml-auto" onclick="toggleSidebar()"><i class="ph ph-list text-2xl"></i></button>
        </header>

        <!-- VIDEO CONTAINER -->
        <div id="videoContainer" class="flex-1 bg-black w-full flex items-center justify-center relative overflow-hidden">
            <div class="text-slate-500 text-center">
                <i class="ph-bold ph-spinner-gap animate-spin text-4xl mb-3"></i>
                <p>Mempersiapkan pemutar...</p>
            </div>
        </div>

        <!-- VIDEO INFO -->
        <div class="bg-slate-900 p-6 border-t border-slate-800 shrink-0 hidden md:block z-10">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h2 class="text-2xl font-bold text-white mb-1" id="videoTitle">Memuat Modul...</h2>
                    <p class="text-slate-400 text-sm" id="videoSub">Mengambil data aman.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- SIDEBAR PLAYLIST -->
    <aside id="sidebar" class="w-full md:w-80 lg:w-96 bg-slate-900 md:border-l md:border-slate-800 flex flex-col h-[40vh] md:h-screen transition-transform duration-300 z-20">
        <div class="p-5 border-b border-slate-800 shrink-0">
            <h3 class="font-bold text-white text-lg mb-2">Daftar Modul</h3>
        </div>
        <div id="playlist-container" class="flex-1 overflow-y-auto p-3 space-y-2">
            <div class="text-center text-slate-500 text-sm mt-10">
                <i class="ph-bold ph-spinner-gap animate-spin text-2xl mb-2"></i>
                <p>Mengambil data...</p>
            </div>
        </div>
    </aside>

    <script src="../js/crypto_client.js?v=4"></script>
    <script>
        let courseModules = [];

        // 1. TANGKAP ID DARI URL DENGAN AKURAT
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const courseId = urlParams.get('course_id') || 1; // Jika kosong, default 1
            
            document.getElementById('courseTitleHeader').innerText = `Kursus ID #${courseId}`;
            await fetchCourseData(courseId);
        });

        // 2. FETCH DATA KE SERVER
        async function fetchCourseData(courseId) {
            try {
                const response = await fetch(`https://kursus.mitrautamateknologi.xyz/public/api.php?ctrl=course&action=get_modules&course_id=${courseId}&nocache=${new Date().getTime()}`);
                const result = await response.json();

                if (result.status === 'success') {
                    const decrypted = await decryptPayload(result.data.payload, result.data.iv, result.data.tag);

                    if (decrypted) {
                        courseModules = decrypted.data;
                        
                        // LOGIKA PENTING: Jika Dosen Belum Upload Video untuk Kursus Ini
                        if (!courseModules || courseModules.length === 0) {
                            document.getElementById('videoContainer').innerHTML = `
                                <div class="text-slate-500 text-center">
                                    <i class="ph-duotone ph-video-camera-slash text-6xl mb-3 text-slate-600"></i>
                                    <p class="font-bold">Belum Ada Materi</p>
                                    <p class="text-sm mt-1">Dosen belum mengunggah video untuk kursus ini.</p>
                                </div>
                            `;
                            document.getElementById('playlist-container').innerHTML = '<p class="text-center text-slate-600 text-sm p-4">Playlist kosong.</p>';
                            document.getElementById('videoTitle').innerText = "Belum Ada Modul";
                            document.getElementById('videoSub').innerText = "Menunggu pembaruan dari Admin.";
                            return;
                        }

                        renderPlaylist(); 
                        playVideo(courseModules[0], 0); 
                    }
                }
            } catch (error) {
                console.error("Gagal memuat:", error);
            }
        }

        // 3. RENDER PLAYLIST
        function renderPlaylist() {
            const sidebar = document.getElementById('playlist-container'); 
            sidebar.innerHTML = ''; 

            courseModules.forEach((modul, index) => {
                const mins = Math.floor(modul.duration_seconds / 60);
                const secs = (modul.duration_seconds % 60).toString().padStart(2, '0');

                const btn = document.createElement('button');
                btn.className = `w-full text-left p-3 rounded-xl transition group flex gap-3 items-start ${index === 0 ? 'bg-slate-800 border border-slate-700' : 'hover:bg-slate-800 opacity-80'}`;
                
                btn.onclick = () => {
                    playVideo(modul, index);
                    Array.from(sidebar.children).forEach(child => {
                        child.className = 'w-full text-left p-3 rounded-xl hover:bg-slate-800 transition group flex gap-3 items-start opacity-80';
                        child.querySelector('i').className = 'ph-fill ph-circle text-xl';
                    });
                    btn.className = 'w-full text-left p-3 rounded-xl bg-slate-800 border border-slate-700 transition group flex gap-3 items-start';
                    btn.querySelector('i').className = 'ph-fill ph-play-circle animate-pulse text-xl';
                };
                
                btn.innerHTML = `
                    <div class="mt-0.5 text-indigo-500"><i class="ph-fill ${index === 0 ? 'ph-play-circle animate-pulse' : 'ph-circle'} text-xl"></i></div>
                    <div>
                        <p class="text-indigo-400 text-sm font-bold line-clamp-1">${modul.sequence}. ${modul.title}</p>
                        <p class="text-slate-400 text-xs mt-1"><i class="ph-fill ph-clock"></i> ${mins}:${secs}</p>
                    </div>
                `;
                sidebar.appendChild(btn);
            });
        }

        // 4. PUTAR VIDEO (BYPASS NATIVE / YOUTUBE)
        function playVideo(modulData, activeIndex) {
            document.getElementById('videoTitle').innerText = `${modulData.sequence}. ${modulData.title}`;
            document.getElementById('videoSub').innerText = `Modul ke-${modulData.sequence}`;
            
            let videoUrl = modulData.video_url;
            const container = document.getElementById('videoContainer');

            if (videoUrl.includes('youtube.com') || videoUrl.includes('youtu.be')) {
                const match = videoUrl.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
                const ytId = (match && match[2].length === 11) ? match[2] : 'bTqVqk7FSmY';
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1" class="absolute top-0 left-0 w-full h-full" frameborder="0" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
            } else {
                container.innerHTML = `
                    <video controls autoplay playsinline class="absolute top-0 left-0 w-full h-full object-contain bg-black" controlsList="nodownload">
                        <source src="${videoUrl}" type="video/mp4">
                    </video>`;
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('hidden');
            document.getElementById('sidebar').classList.toggle('flex');
        }
    </script>
</body>
</html>
